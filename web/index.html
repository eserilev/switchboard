<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Switchboard</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="rail" id="rail" aria-label="Switchboard">
    <div class="rtop">
      <span class="brand" aria-hidden="true">SWITCHBOARD</span>
      <button class="rbtn" id="newpane" type="button" aria-label="New pane or review (Leader n)" title="New pane or review (Leader n)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    </div>
    <div class="rnav" id="tabs"></div>
    <span class="rsp"></span>
    <div class="rfoot">
      <span class="host" id="host" hidden title="The hub runs on this server (SPEC 29)"></span>
      <div class="conn">
        <button class="rbtn rconn" id="conn" type="button" aria-haspopup="menu"></button>
        <div class="menu" id="connmenu" role="menu" hidden></div>
      </div>
      <button class="rbtn" id="gear" type="button" aria-label="Settings" title="Settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </div>
  </nav>

  <div class="app">
    <div class="link" id="link" role="status" hidden><span id="linktext"></span><button class="btn small" id="linkgo" type="button">Reconnect</button></div>

    <div class="stage">
      <div class="screens" id="screens">
        <main id="view-board" class="board-wrap">
          <header class="head" id="bhead">
            <div class="tally" id="tally" role="group" aria-label="Tiles that wait on you"></div>
            <span class="sp"></span>
            <button class="btn" id="bnext" type="button" title="The next tile that waits on you (Leader j)">Next waiting <kbd>j</kbd></button>
          </header>
          <section class="live" id="live" hidden>
            <div class="ptitle" id="livetitle"></div>
            <div class="lparts" id="lparts">
              <div class="lleft" id="lleft">
                <div class="part" id="pagent" data-part="agent"><div class="parthead"></div><div class="term" id="term"></div></div>
                <div class="gutter gy" id="gterm" hidden title="Drag to size the terminal. Double-click to reset."></div>
                <div class="part" id="pterm" data-part="term" hidden><div class="parthead"></div><div class="term" id="tterm"></div></div>
              </div>
              <div class="gutter gx" id="gnvim" hidden title="Drag to size nvim. Double-click to reset."></div>
              <div class="part" id="pnvim" data-part="nvim" hidden><div class="parthead"></div><div class="term" id="tnvim"></div></div>
            </div>
          </section>
          <div class="gutter gy" id="bgutter" hidden title="Drag to size the terminal and the tiles. Double-click to reset."></div>
          <section class="board" id="board" aria-label="Tiles"></section>
        </main>

        <main id="view-review" class="review" hidden></main>

        <main id="view-tasks" class="tasks" hidden></main>

        <main id="view-work" class="workenv" hidden>
          <header class="head wbar" id="wbar"></header>
          <div class="whost" id="whost"></div>
        </main>

        <button class="btn itog" id="itoggle" type="button" aria-controls="insp" aria-pressed="false" aria-label="Details (Leader i)" title="Details (Leader i)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/><path d="M10 2.5v11"/></svg></button>
      </div>
      <aside class="insp" id="insp" aria-label="Details" hidden></aside>
    </div>
  </div>
  <div class="finish" id="tbox" hidden></div>
  <span class="leader" id="leader" hidden>Leader</span>

  <div class="launcher" id="settings" hidden>
    <div class="lbox sbox" role="dialog" aria-label="Settings">
      <h3>Settings</h3>
      <div class="lrows" id="sbody"></div>
      <div class="lfoot">
        <span class="lerr" id="serr"></span>
        <button class="btn" id="scancel" type="button">Cancel</button>
        <button class="btn primary" id="ssave" type="button">Save</button>
      </div>
    </div>
  </div>

  <div class="launcher" id="launcher" hidden>
    <div class="lbox" role="dialog" aria-label="New pane">
      <input id="lq" autocomplete="off" spellcheck="false" aria-label="Repo or PR URL">
      <ul class="lrepos" id="lrepos" role="listbox" aria-label="Repos"></ul>
      <div class="lrows" id="lrows">
        <div class="seg" id="lwhere" aria-label="Where">
          <button type="button" data-v="main">Main checkout</button>
          <button type="button" data-v="new">New worktree</button>
          <button type="button" data-v="tree">Existing worktree</button>
        </div>
        <input id="lbranch" autocomplete="off" spellcheck="false" aria-label="Branch" hidden>
        <select id="ltree" aria-label="Worktree" hidden></select>
        <div class="seg" id="lrun" aria-label="Run">
          <button type="button" data-v="claude">Claude Code</button>
          <button type="button" data-v="nvim">nvim</button>
          <button type="button" data-v="shell">Shell</button>
        </div>
        <div class="ltask" id="ltask" hidden>
          <div class="ltaskhead">For task <b id="ltasktitle"></b></div>
          <textarea id="lfirst" rows="4" aria-label="First message" title="Pasted into Claude with no Enter, when it is ready"></textarea>
        </div>
        <div class="layouts" id="llayouts"></div>
      </div>
      <div class="lfoot">
        <span class="lerr" id="lerr"></span>
        <button class="btn" id="lsave" type="button">Save layout</button>
        <button class="btn" id="lcancel" type="button">Cancel</button>
        <button class="btn primary" id="lgo" type="button">Open</button>
      </div>
    </div>
  </div>

  <div class="menu taskmenu" id="taskmenu" role="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="split.js"></script>
  <script src="app.js"></script>
  <script src="parts.js"></script>
  <script src="review.js"></script>
  <script src="tasks.js"></script>
  <script src="work.js"></script>
</body>
</html>
