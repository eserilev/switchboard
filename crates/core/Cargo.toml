[package]
name = "switchboard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
# The version that toml 0.8 uses: Settings edits the config and keeps its comments.
toml_edit = "0.20"
tracing = "0.1"
guide-check = { path = "../guide-check" }
libc = "0.2"
base64 = "0.22"
outq = { path = "../outq" }
git-argcheck = { path = "../git-argcheck" }
diffparse = { path = "../diffparse" }
