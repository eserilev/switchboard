# Checks the Quint models (SPEC 25, 26, 29) with scripts/check-models.sh, at the
# full count of random runs: with 20,000 a broken model (initAnyAnswer) can pass.
name: models
on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Quint
        run: npm install -g @informalsystems/quint@0.33.1
      - name: Check the models
        run: scripts/check-models.sh
