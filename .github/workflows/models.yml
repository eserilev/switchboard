# Checks the Quint models (SPEC 25, 26, 26.1, 29) with scripts/check-models.sh, at the
# full count of random runs: with 20,000 a broken model (initAnyAnswer) can pass.
# It runs when a model or the code it describes changes (CLAUDE.md), and nightly.
name: models
on:
  push:
    paths:
      - "models/**"
      - "scripts/check-models.sh"
      - ".github/workflows/models.yml"
      - "crates/core/src/hub.rs"
      - "crates/core/src/hub_review.rs"
      - "crates/core/src/review.rs"
      - "crates/core/src/cleanup.rs"
      - "crates/core/src/remote.rs"
      - "crates/core/src/dispatch.rs"
      - "crates/sb/src/**"
      - "crates/app/src/main.rs"
      - "web/app.js"
  pull_request:
    paths:
      - "models/**"
      - "scripts/check-models.sh"
      - ".github/workflows/models.yml"
      - "crates/core/src/hub.rs"
      - "crates/core/src/hub_review.rs"
      - "crates/core/src/review.rs"
      - "crates/core/src/cleanup.rs"
      - "crates/core/src/remote.rs"
      - "crates/core/src/dispatch.rs"
      - "crates/sb/src/**"
      - "crates/app/src/main.rs"
      - "web/app.js"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Quint
        run: npm install -g @informalsystems/quint@0.33.1
      - name: Check the models
        run: scripts/check-models.sh
