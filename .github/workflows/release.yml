# On a tag v*, builds a Linux tarball and a macOS app, and puts them on a GitHub
# release. scripts/install.sh downloads them, so an install needs no Rust.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # The tag must name the version in every file that has one, so a release never
  # ships with an old version inside.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the versions
        run: |
          tag=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tauri=$(jq -r .version crates/app/tauri.conf.json)
          arch=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          echo "tag $tag, Cargo.toml $cargo, tauri.conf.json $tauri, PKGBUILD $arch"
          ok=1
          for v in "$cargo" "$tauri" "$arch"; do
            [ "$v" = "$tag" ] || ok=0
          done
          if [ "$ok" != 1 ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the versions in the files."
            exit 1
          fi
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libssl-dev librsvg2-dev
      - name: Build
        run: cargo build --release --locked -p switchboard -p sb
      - name: Pack
        run: |
          mkdir out
          cp target/release/switchboard target/release/sb packaging/switchboard.desktop out/
          cp crates/app/icons/icon.png out/switchboard.png
          tar -czf switchboard-linux-x86_64.tar.gz -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: switchboard-linux-x86_64.tar.gz
  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Switchboard.app
        run: scripts/macos-app.sh "$RUNNER_TEMP/out"
      - name: Pack
        run: ditto -c -k --keepParent "$RUNNER_TEMP/out/Switchboard.app" Switchboard-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Switchboard-macos-arm64.zip
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes switchboard-linux-x86_64.tar.gz Switchboard-macos-arm64.zip
